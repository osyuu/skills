# spec-claim-check 的門檻與路徑。留空即用預設（見 hooks/spec-claim-check.sh 檔頭）。
#
# SPEC_GLOBS       哪些檔案算 spec（預設 "design-doc-*.md docs/design/*.md"）
# SPEC_SRC_DIRS    產品原始碼目錄（預設 "src lib app"）
# SPEC_TEST_DIRS   測試目錄（預設 "test tests spec __tests__"）
# SPEC_SRC_EXTS    只掃這些副檔名，索引才不會被資產檔灌爆
# SPEC_SYMBOL_MIN_LEN  短識別字在散文裡到處都是，低於此長度不看（預設 8）
# SPEC_DEF_RE      「定義」長什麼樣，非 C 家族語言要覆寫
# SPEC_IGNORE_RE   天生沒有使用者的符號（預設擋 SwiftUI preview 型別）
